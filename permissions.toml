# Checked before every call of the coding agent. Deny wins; then allow; anything else asks.
# A rule matches "tool(argument)": the command for run, the path for the file tools.

deny = [
  "run(rm *)", "run(*rm -rf*)", "run(*curl*)",
  "read_file(.env*)",
]

allow = [
  "read_file(*)", "search(*)", "load_skill(*)", "explore(*)", "list_tests(*)",
  "edit_file(src/*)", "edit_file(tests/*)", "write_file(src/*)", "write_file(tests/*)",
  "run(python -m pytest*)", "run(pytest*)",
  "run(ls*)", "run(find *)", "run(grep *)", "run(cat *)",
  "run(git status*)", "run(git diff*)", "run(git log*)", "run(git add *)", "run(git commit *)",
  "run(git checkout -b agent/*)", "run(git push origin agent/*)",
]